name: buildx

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 5"

env:
  IMAGE_NAME: ghcr.io/by275/adguardhome
  X_SKIP: "true"

defaults:
  run:
    shell: bash

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        build: [latest, beta]
    concurrency:
      group: buildx-${{ github.ref }}-${{ matrix.build }}
      cancel-in-progress: true
    steps:
      -
        name: Check if buildx required
        run: |
          set -uo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "X_SKIP=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if ! docker run --rm --entrypoint=cat "adguard/adguardhome:${{ matrix.build }}" \
            /opt/adguardhome/AdGuardHome > bin1 || \
             ! docker run --rm --entrypoint=cat "${IMAGE_NAME}:${{ matrix.build }}" \
            /usr/local/bin/AdGuardHome > bin2 || \
             ! cmp -s bin1 bin2; then
            echo "X_SKIP=false" >> "$GITHUB_ENV"
          fi
      -
        name: Checkout
        if: env.X_SKIP == 'false'
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        if: env.X_SKIP == 'false'
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Buildx
        if: env.X_SKIP == 'false'
        uses: docker/setup-buildx-action@v4
      -
        name: Build Unbound (amd64)
        if: env.X_SKIP == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: unbound.dockerfile
          build-args: |
            ARCH=amd64
          outputs: type=local,dest=./unbound/amd64
          cache-from: type=gha,scope=adguardhome-unbound-${{ matrix.build }}-amd64
          cache-to: type=gha,mode=max,scope=adguardhome-unbound-${{ matrix.build }}-amd64,ignore-error=true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
      -
        name: Build Unbound (arm64)
        if: env.X_SKIP == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: unbound.dockerfile
          build-args: |
            ARCH=arm64
          outputs: type=local,dest=./unbound/arm64
          cache-from: type=gha,scope=adguardhome-unbound-${{ matrix.build }}-arm64
          cache-to: type=gha,mode=max,scope=adguardhome-unbound-${{ matrix.build }}-arm64,ignore-error=true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
      -
        name: Login to ghcr.io
        if: env.X_SKIP == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Buildx and Push
        if: env.X_SKIP == 'false'
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.build }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            AGH_BUILD=${{ matrix.build }}
          cache-from: type=gha,scope=adguardhome-${{ matrix.build }}
          cache-to: type=gha,mode=max,scope=adguardhome-${{ matrix.build }},ignore-error=true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
      -
        name: Check image version and promote version tag
        if: env.X_SKIP == 'false'
        id: version
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "$IMAGE_DIGEST" ]]; then
            echo "The build did not produce an image digest." >&2
            exit 1
          fi

          image="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "$image"
          version="$({
            docker run --rm --platform linux/amd64 \
              --entrypoint /usr/local/bin/AdGuardHome \
              "$image" --version
          } | awk '{print $NF}' | cut -d'+' -f1)"

          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image version: ${version:-empty}" >&2
            exit 1
          fi

          echo "Detected AdGuardHome version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${version}" \
            "${image}"
      -
        name: Notification
        uses: sarisia/actions-status-discord@v1
        if: env.X_SKIP == 'false' && always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          description: |
            ${{ env.IMAGE_NAME }}:${{ matrix.build }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version || 'unknown' }}
